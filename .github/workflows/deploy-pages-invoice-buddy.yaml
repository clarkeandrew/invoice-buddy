name: "[Deploy] Pages"

# Publishes docs/ to GitHub Pages. The page reads the latest release from the
# GitHub API in the browser, so new releases appear without a redeploy.
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - .github/workflows/deploy-pages-invoice-buddy.yaml
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
