name: "[Test] Checks"

# Also runs on main so the apt and Rust caches are saved there, where every
# PR branch can restore them. A PR branch can't read another PR's caches.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1
        timeout-minutes: 10
        with:
          packages: libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev
          version: 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      # tauri build refuses mismatched npm/Rust Tauri versions, but nothing else
      # checks them before release. tauri info reports the mismatch without failing.
      - name: Tauri npm and Rust versions match
        run: |
          bun tauri info 2>&1 | tee tauri-info.txt
          if grep -q "version mismatched" tauri-info.txt; then
            echo "::error::Tauri npm packages and Rust crates are on different minor versions. Align them before releasing."
            exit 1
          fi

      - name: Type-check frontend
        run: bunx tsc --noEmit

      - name: Frontend tests
        run: bun run test

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
