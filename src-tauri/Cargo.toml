[package]
name = "invoice-buddy"
version = "0.1.0"
description = "A local-first desktop invoice application"
authors = ["Andrew Clarke"]
license = "MIT"
repository = "https://github.com/clarkeandrew/invoice-buddy"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.33", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tauri = { version = "2.10.3", features = ["devtools", "protocol-asset"] }
tauri-plugin-dialog = "2"
log = "0.4"
tauri-plugin-log = "2"
tauri-plugin-process = "2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
